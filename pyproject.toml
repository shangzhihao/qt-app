[project]
name = "qt-graph"
version = "0.1.0"
description = "Toy product for the quality-tracking prototype (plays the role of vws-graph)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-reportlog>=0.4",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qt_graph"]

[tool.pytest.ini_options]
pythonpath = ["tests", "scripts"]
addopts = "-p qt_plugin"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
