[project]
name = "qt-app"
version = "0.1.0"
description = "Toy product for the quality-tracking prototype (plays the role of vws-graph)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-reportlog>=0.4",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qt_graph"]

[tool.pytest.ini_options]
pythonpath = ["tests", "scripts"]
addopts = "-p qt_plugin --strict-markers"
markers = [
    "core: core topics, run as their own pytest instance",
    "extended: other topics, run as their own pytest instance",
]
testpaths = ["tests"]

# Quality tracking. Components are repos whose content affects answer quality:
# qt-app itself, and every other one checked out at the tested version and
# exposed to the tests as QT_COMPONENT_<NAME>_PATH.
[tool.qt.components.graph]
repo = "shangzhihao/qt-app"
branch = "main"

[tool.qt.components.data]
repo = "shangzhihao/qt-dep"
branch = "main"

# A run is split into one pytest instance (shard) per marker; every quality
# case carries exactly one of them, which the qt plugin checks. Without
# markers, runs are split by case-key hash.
[tool.qt.run]
markers = ["core", "extended"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
