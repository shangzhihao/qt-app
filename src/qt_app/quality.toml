# Graph-side answer quality per topic (1.0 = full quality). Lowering a value
# simulates a code regression on that topic.
[factors]
benefits = 1.0
deadlines = 1.0
documents = 1.0
eligibility = 1.0
fees = 1.0
forms = 1.0
housing = 0.7
income = 1.0
residence = 1.0
taxes = 1.0

# Day-to-day noise with no code or data change: each UTC day draws one overall
# shift and one per topic (standard deviations below), shared by every run that
# day. 0 turns it off.
[daily_noise]
overall = 0.02
topic = 0.03
